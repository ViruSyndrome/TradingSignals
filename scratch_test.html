<!DOCTYPE html>
<html>
<head>
<style>
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 10px; }
.card-title-row { display: flex; align-items: flex-start; gap: 12px; flex: 1; min-width: 0; }
.asset-icon { font-size: 24px; min-width: 40px; height: 40px; border-radius: 50%; background: red; display: flex; align-items: center; justify-content: center; }
.asset-meta { min-width: 0; flex: 1; overflow: hidden; background: yellow; }
.asset-name { font-weight: 600; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asset-symbol { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.asset-card { width: 320px; border: 1px solid black; padding: 20px; box-sizing: border-box; }
.signal-badge { background: green; padding: 6px 12px; display: inline-flex; align-items: center; white-space: nowrap; font-size: 12px;}
.card-badges { display: flex; gap: 4px; overflow: hidden; white-space: nowrap; }
.cat-badge-inline { font-size: 10px; }
</style>
</head>
<body>
  <div class='asset-card'>
    <div class='card-header'>
      <div class='card-title-row'>
        <span class='asset-icon'>BTC</span>
        <div class='asset-meta'>
          <div class='asset-name'>NEIRO (Neiro on Ethereum)</div>
          <div class='asset-symbol'>NEIROUSDT</div>
          <div class='card-badges'>
             <span class='cat-badge-inline'>₿ Crypto</span>
          </div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <div style="display:flex; gap: 4px;">
          <button style='min-width: 24px'>🔒</button>
          <button style='min-width: 24px'>⭐</button>
        </div>
        <div class='signal-badge'>🚀 STRONG BUY ↗️</div>
      </div>
    </div>
  </div>
</body>
</html>
