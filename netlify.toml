# Netlify build & cache configuration

[build]
  publish = "."

# Never cache index.html — always serve the latest version.
# This ensures that when we deploy new JS/CSS with version strings,
# browsers immediately pick up the new ?v=X.X cache busters.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache all versioned JS/CSS files aggressively (they have ?v= cache busters)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
