name: Weekly Red Bar Desk Backtest

on:
  schedule:
    # Runs every Sunday at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Red Bar Futures Desk Walk-Forward Backtest & Live Readout
        run: node redbar_desk_backtest.js --live 2>&1 | tee backtest_output.txt

      - name: Upload backtest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbar-backtest-output
          path: backtest_output.txt
          if-no-files-found: ignore
